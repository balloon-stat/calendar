<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>マイスケジュール帳</title>

  <link rel="icon" type="image/png" href="icons/icon-192.png"> 
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a90e2">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/calendar-grid.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body>
  <div class="container">
    <header>
      <button id="prev-month-btn">← 前月</button>
      <h1 id="current-month">4月</h1>
      <button id="next-month-btn">次月 →</button>
      <button id="today-btn">今日</button>
    </header>

    <div class="weekdays">
      <div>日</div><div>月</div><div>火</div><div>水</div>
      <div>木</div><div>金</div><div>土</div>
    </div>

    <div id="calendar" class="calendar"></div>
  </div>

  <!-- 予定モーダル -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-date"></h2>
        <button id="close-modal-btn">×</button>
      </div>

      <div id="events-list" class="events-list"></div>

      <div class="add-event-form">
        <h3 id="form-title">予定を追加</h3>

        <input type="text" id="event-title" placeholder="予定のタイトル" required>

        <!-- 終日チェックボックス -->
        <label class="all-day-label">
          <input type="checkbox" id="all-day-check">
          <span>終日予定</span>
        </label>

        <input type="time" id="event-time">
        <textarea id="event-memo" placeholder="メモ（任意）"></textarea> 

        <div class="form-buttons">
          <button id="close-btn">閉じる</button>
          <button id="save-btn">予定を追加</button>
        </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast">
    <span id="toast-msg"></span>
  </div>

  <script type="module" src="js/calendar.js"></script>
</body>
</html>
